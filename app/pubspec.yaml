name: pet_monitoring
description: Smart Pet Monitoring System with IoT-Based Environmental Control (Flutter dashboard)

publish_to: 'none'

version: 2.0.0+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^4.2.1
  cloud_firestore: ^6.1.0
  firebase_auth: ^6.1.2
  firebase_database: ^12.3.0
  intl: ^0.20.2
  fl_chart: ^1.1.1
  google_fonts: ^8.1.0
  image_picker: ^1.1.2
  country_picker: ^2.0.28
  shared_preferences: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
