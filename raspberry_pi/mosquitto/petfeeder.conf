# Copy to /etc/mosquitto/conf.d/petfeeder.conf, then:  sudo systemctl restart mosquitto
#
# Mosquitto 2.x only listens on localhost by default, so the ESP32 could
# not connect. This opens port 1883 on the LAN and requires a password.
listener 1883 0.0.0.0
allow_anonymous false
password_file /etc/mosquitto/passwd
